          content="Play PICO-8 cartridges natively on your Android phone or retro handheld. Low-latency audio, gamepad-first controls, multicart support. Built by CodeDreams BV." />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph — also used by Bluesky, LinkedIn, Slack, Mastodon etc.
         for link-preview cards. The image is the rainbow SVG logo for now;
         swap to a 1200×630 PNG card before launch for sharper rendering
         on services that don't rasterise SVG. -->
    <meta property="og:title" content="Pixl8 — a native PICO-8 player for Android" />
    <meta property="og:description" content="Play PICO-8 cartridges natively on your Android phone or retro handheld." />

    <meta property="og:site_name" content="Pixl8" />

    <!-- Canonical URL — disambiguates pixl8.dev vs pixl8.eu (301'd) vs

         the authoritative version. -->
    <link rel="canonical" href="https://pixl8.dev/" />

    <!-- Schema.org structured data — gives Google rich-result data:
         SoftwareApplication for Pixl8 itself (lets it show up as an app
         when relevant), Organization for CodeDreams BV with sameAs back
         to the social profile. Add an `offers` block referencing the
         Google Play listing once the app is published. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Pixl8",

        "url": "https://pixl8.dev/",

            "sameAs": [
                "https://bsky.app/profile/macs.eurosky.social",

    <style>
        html, body { background: #000; }
        body       { font-family: 'JetBrains Mono', ui-monospace, monospace; color: #fff; }
        ::selection { background: #ffec27; color: #000; }

        /* Per-pixel reveal for the inlined logo SVG. Each shape inside
         * the logo starts invisible and small, then pops in via the
         * cubic-bezier overshoot for a brief "settle" at the end.
         * The JS at the bottom of the page sorts pixels by their
         * bounding-box Y and stamps a staggered animation-delay so
         * the reveal reads top-to-bottom — feels like a pixel-art
         * sprite being built up row by row.
         *
         * transform-box: fill-box anchors the scale transform to each
         * element's own bbox; without it SVG scales relative to the
         * root viewport and the animation looks wrong. */
        @keyframes pixl8-pop {
            from { opacity: 0; transform: scale(0.4); }
            to   { opacity: 1; transform: scale(1);   }
        }
        .logo-wrap .px {
            opacity: 0;
            transform-origin: center;
            transform-box: fill-box;
            animation: pixl8-pop 0.45s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }

        /* Subtle wordmark / tagline fade-in once the logo is mostly
         * settled. Kept conservative so it doesn't compete with the
         * logo for attention. */
        @keyframes word-fade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .word-in   { opacity: 0; animation: word-fade 0.6s ease-out forwards; }
        .word-in-1 { animation-delay: 1.15s; }
        .word-in-2 { animation-delay: 1.30s; }
        .word-in-3 { animation-delay: 1.45s; }

        @media (prefers-reduced-motion: reduce) {
            .logo-wrap .px,
            .word-in {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        // Logo intro: stagger each pixel's animation-delay by its
        // bounding-box Y position, so the reveal reads top-to-bottom
        // like a sprite being painted row by row. The CSS keyframe is
        // already on .px — we only have to seed the per-element delay.
        // Wrapped in try/catch around getBBox to be safe on browsers
        // that haven't laid out the SVG by the time this runs (rare).
        (function () {
            var pixels = Array.from(document.querySelectorAll('.logo-wrap .px'));
            // Sort by Y. Polygons / rects have different ways to read
            // their starting Y; getBBox().y gives a uniform answer.
            pixels.sort(function (a, b) {
                try { return a.getBBox().y - b.getBBox().y; }
                catch (_) { return 0; }
            });
            // 14 ms per pixel × ~72 pixels ≈ 1.0 s for the full reveal.
            // Pleasant pace; doesn't make the visitor wait too long
            // before the wordmark + tagline finish fading in (see
            // .word-in-* delays in the <style> block).
            pixels.forEach(function (el, i) {
                el.style.animationDelay = (i * 14) + 'ms';
            });
        })();

        // Email obfuscation: the address is stored reversed and base64
        // encoded so simple HTML-regex harvesters don't see "pixl8@…"
        // anywhere in the source. JS reverses + atobs at runtime and
        // fills every `<a class="em">` with both the mailto href and
        // visible text. Not unbreakable — but stops the cheap scrapers
        // responsible for most spam.
        (function () {
            var EMAIL = atob('==QZi5yctFWZyRWZk92YAhDb4lGc'.split('').reverse().join(''));
            document.querySelectorAll('a.em').forEach(function (a) {
                a.href = 'mailto:' + EMAIL;
                a.textContent = EMAIL;
            });
        })();
    </script>
